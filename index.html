<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('scorer-theme-v1');
        const preference = ['system','light','dark'].includes(saved) ? saved : 'dark';
        const resolved = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
      } catch {
        document.documentElement.dataset.themePreference = 'dark';
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <title>Scorer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v035.css">
  <link rel="stylesheet" href="./v036.css">
  <link rel="stylesheet" href="./v037.css">
  <link rel="stylesheet" href="./v038.css">
  <link rel="stylesheet" href="./v039.css">
  <link rel="stylesheet" href="./v040.css">
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark"><img class="brand-icon" src="./assets/app-icon.svg" alt=""></div>
        <div><div class="eyebrow">BRECKSVILLE LABS</div><h1>Scorer</h1></div>
      </div>
      <div class="top-actions">
        <button id="undoBtn" class="icon-btn" type="button" aria-label="Undo">↶</button>
        <button id="swapBtn" class="icon-btn" type="button" aria-label="Swap sides">⇄</button>
        <button id="editBtn" class="icon-btn" type="button" aria-label="Game setup">⚙</button>
        <button id="quickCameraBtn" class="icon-btn quick-camera-btn" type="button" aria-label="Take game photo">📷</button>
        <button id="journalBtn" class="icon-btn" type="button" aria-label="Open Game Diary">📖</button>
        <details id="appearanceMenu" class="appearance-menu">
          <summary class="icon-btn" aria-label="Appearance: Dark appearance" title="Appearance: Dark appearance">
            <span class="appearance-glyph" aria-hidden="true">☾</span>
          </summary>
          <div class="appearance-panel" role="dialog" aria-label="Choose appearance">
            <div class="appearance-panel-head"><strong>Appearance</strong><span>Choose how Scorer looks on this device.</span></div>
            <div class="appearance-options" role="group" aria-label="Theme preference">
              <button class="appearance-option" type="button" data-theme-choice="system" aria-pressed="false"><span aria-hidden="true">◐</span><b>System</b><small>Match device</small></button>
              <button class="appearance-option" type="button" data-theme-choice="light" aria-pressed="false"><span aria-hidden="true">☀</span><b>Light</b><small>Bright court</small></button>
              <button class="appearance-option" type="button" data-theme-choice="dark" aria-pressed="true"><span aria-hidden="true">☾</span><b>Dark</b><small>Night game</small></button>
            </div>
            <div id="appearanceCurrent" class="appearance-current" aria-live="polite">Dark appearance</div>
          </div>
        </details>
        <button id="displayBtn" class="display-btn" type="button">Display</button>
      </div>
    </header>

    <section class="match-strip">
      <div class="sport-pill" id="sportPill">🏐 Volleyball</div>
      <div class="match-center">
        <span class="period-label" id="periodText">Set 1</span>
        <button id="clockBtn" class="clock hidden" type="button">10:00</button>
      </div>
      <div class="save-chip" id="saveStatus">Saved</div>
    </section>

    <main id="gameSurface" class="game-surface"></main>
    <section id="sportTools" class="sport-tools"></section>
  </div>

  <button class="exit-display hidden" id="exitDisplayBtn" type="button">Exit display</button>
  <input id="quickPhotoInput" class="quick-photo-input" type="file" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
  <div class="toast" id="toast" role="status"></div>

  <div class="modal-backdrop" id="setupModal" aria-hidden="true">
    <div class="setup-modal" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <div class="modal-header">
        <div><div class="eyebrow">MATCH CONTROL</div><h2 id="setupTitle">Set up scoreboard</h2></div>
        <button id="closeSetupBtn" class="icon-btn" type="button" aria-label="Close setup">✕</button>
      </div>

      <section class="setup-section">
        <label class="section-label">Choose sport</label>
        <div id="sportGrid" class="sport-grid"></div>
      </section>

      <section class="setup-section team-setup-grid">
        <div class="team-setup-card">
          <div class="team-setup-title"><span class="dot dot-a"></span>Side A</div>
          <div class="favorite-row"><select id="favoriteSelectA" aria-label="Saved Side A team"><option value="">Saved team…</option></select><button id="saveFavoriteA" class="mini-btn" type="button">★ Save</button><button id="deleteFavoriteA" class="mini-btn" type="button">Remove</button></div>
          <label>Team / player name<input id="inputNameA" value="Home" maxlength="40"></label>
          <label>Color<input id="inputColorA" type="color" value="#2563eb"></label>
          <label>Logo<input id="inputLogoA" type="file" accept="image/png,image/jpeg,image/webp"></label>
          <div id="logoPreviewA" class="logo-preview"></div>
          <label>Roster / player names<textarea id="inputRosterA" rows="6" placeholder="One player per line&#10;Or paste a CSV column"></textarea></label>
          <label class="file-pick">Import roster (.txt/.csv)<input id="inputRosterFileA" type="file" accept=".txt,.csv,text/plain,text/csv"></label>
        </div>
        <div class="team-setup-card">
          <div class="team-setup-title"><span class="dot dot-b"></span>Side B</div>
          <div class="favorite-row"><select id="favoriteSelectB" aria-label="Saved Side B team"><option value="">Saved team…</option></select><button id="saveFavoriteB" class="mini-btn" type="button">★ Save</button><button id="deleteFavoriteB" class="mini-btn" type="button">Remove</button></div>
          <label>Team / player name<input id="inputNameB" value="Away" maxlength="40"></label>
          <label>Color<input id="inputColorB" type="color" value="#e11d48"></label>
          <label>Logo<input id="inputLogoB" type="file" accept="image/png,image/jpeg,image/webp"></label>
          <div id="logoPreviewB" class="logo-preview"></div>
          <label>Roster / player names<textarea id="inputRosterB" rows="6" placeholder="One player per line&#10;Or paste a CSV column"></textarea></label>
          <label class="file-pick">Import roster (.txt/.csv)<input id="inputRosterFileB" type="file" accept=".txt,.csv,text/plain,text/csv"></label>
        </div>
      </section>

      <section id="sportSettings" class="setup-section"></section>

      <div class="modal-footer">
        <button id="resetSavedBtn" class="secondary-btn" type="button">New match</button>
        <button id="startGameBtn" class="primary-btn" type="button">Start scoreboard</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="journalModal" aria-hidden="true">
    <div class="setup-modal journal-modal" role="dialog" aria-modal="true" aria-labelledby="journalTitle">
      <div class="modal-header">
        <div><div class="eyebrow">GAME DIARY</div><h2 id="journalTitle">Game story</h2></div>
        <button id="closeJournalBtn" class="icon-btn" type="button" aria-label="Close game diary">✕</button>
      </div>
      <div class="journal-layout">
        <section class="journal-main">
          <div id="journalMatchCard" class="journal-match-card"></div>
          <div id="diarySummary" class="diary-summary"></div>
          <div id="capturePanel" class="capture-panel diary-composer">
            <label class="diary-note-field">Quick note<input id="photoCaption" maxlength="500" placeholder="Huge save, great rally, first goal, celebration…"></label>
            <label class="highlight-toggle"><input id="momentHighlight" type="checkbox"> <span>⭐ Highlight this moment</span></label>
            <div class="diary-composer-actions">
              <button id="diaryCameraBtn" class="camera-btn" type="button">📷 Take photo</button>
              <label class="secondary-btn gallery-pick">🖼 Choose photo<input id="photoInput" type="file" accept="image/*"></label>
              <button id="saveNoteBtn" class="secondary-btn diary-note-btn" type="button">📝 Save note</button>
              <button id="archiveMatchBtn" class="secondary-btn" type="button">Save match</button>
            </div>
          </div>
          <div id="albumGrid" class="album-grid diary-timeline"></div>
        </section>
        <aside class="history-panel">
          <div class="section-label">Match history</div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </div>
    </div>
  </div>

  <div class="camera-overlay hidden" id="cameraModal" aria-hidden="true">
    <section class="camera-sheet" role="dialog" aria-modal="true" aria-labelledby="cameraTitle">
      <div class="camera-sheet-head">
        <div><div class="eyebrow">GAME MOMENT</div><h2 id="cameraTitle">Take photo</h2></div>
        <button id="cameraCancelBtn" class="icon-btn" type="button" aria-label="Close camera">✕</button>
      </div>
      <div class="camera-preview-wrap">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <div id="cameraStatus" class="camera-status">Starting camera…</div>
      </div>
      <div class="camera-actions">
        <button id="cameraCaptureBtn" class="primary-btn" type="button" disabled>📷 Capture</button>
        <button id="cameraFallbackBtn" class="secondary-btn" type="button">Use phone camera instead</button>
      </div>
      <div class="camera-hint">The score stamp is captured when you press Capture.</div>
    </section>
  </div>

  <script type="module" src="./theme.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./enhancements.js"></script>
  <script type="module" src="./v031.js"></script>
  <script type="module" src="./v032.js"></script>
  <script type="module" src="./v033.js"></script>
  <script type="module" src="./v034.js"></script>
  <script type="module" src="./v034-guard.js"></script>
  <script type="module" src="./v039.js"></script>
  <script type="module" src="./v040.js"></script>
</body>
</html>
