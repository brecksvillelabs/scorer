name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Package Volleyball QC source
        if: always()
        run: |
          zip -qr scorer-volleyball-qc-source.zip . \
            -x ".git/*" "node_modules/*" "android/.gradle/*" "android/app/build/*" "android/build/*" "android/qc-output/*"
      - name: Upload Volleyball QC source bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorer-volleyball-qc-source
          path: scorer-volleyball-qc-source.zip
          if-no-files-found: error
          retention-days: 14
