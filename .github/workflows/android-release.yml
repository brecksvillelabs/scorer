name: Android Release QC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-release-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCORER_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/scorer-ci-only-release.jks
      SCORER_UPLOAD_STORE_PASSWORD: ci-only-not-for-play
      SCORER_UPLOAD_KEY_ALIAS: scorer-ci-only
      SCORER_UPLOAD_KEY_PASSWORD: ci-only-not-for-play
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate disposable CI-only signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$SCORER_UPLOAD_KEYSTORE_PATH" \
            -storepass "$SCORER_UPLOAD_STORE_PASSWORD" \
            -keypass "$SCORER_UPLOAD_KEY_PASSWORD" \
            -alias "$SCORER_UPLOAD_KEY_ALIAS" \
            -dname "CN=Scorer CI Only, OU=Automated QC, O=Brecksville Labs, L=Brecksville, ST=Ohio, C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Prepare native assets
        run: npm run native:sync

      - name: Build signed release bundle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify release bundle signature and integrity
        run: |
          set -euo pipefail
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          unzip -t "$bundle"
          jarsigner -verify -verbose -certs "$bundle" | tee "$RUNNER_TEMP/scorer-jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/scorer-jarsigner.txt"
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Enable KVM for Android 16 release QC
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify release notification delivery on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./android/gradlew -p android -PscorerTestBuildType=release connectedReleaseAndroidTest --stacktrace

      - name: Upload Android 16 release test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorer-v0.5.1-android16-release-test-reports
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Upload CI-only release bundle
        uses: actions/upload-artifact@v4
        with:
          name: scorer-v0.5.1-ci-only-not-for-play-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
