name: v0.3.5 alternate QC
on:
  push:
    branches:
      - v0.3.5-lacrosse-kabaddi
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
